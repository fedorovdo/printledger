services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printledger}
      POSTGRES_USER: ${POSTGRES_USER:-printledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printledger} -d ${POSTGRES_DB:-printledger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/fedorovdo/printledger-backend:${PRINTLEDGER_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-printledger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-printledger}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/fedorovdo/printledger-frontend:${PRINTLEDGER_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/printledger.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
